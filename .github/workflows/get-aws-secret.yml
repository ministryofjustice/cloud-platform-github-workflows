name: Get AWS Secret (encrypted)

on:
  workflow_call:
    inputs:
      secret_name:
        required: true
        type: string
        description: "Name the secret is exposed under (becomes the env var name in decrypt-secret)"
      secret_arn_ssm_parameter:
        required: false
        type: string
        default: ""
        description: "SSM parameter name holding the secret ARN. Used if secret_id is not set"
      secret_id:
        required: false
        type: string
        default: ""
        description: "Secret name or ARN in Secrets Manager. Overrides secret_arn_ssm_parameter"
      aws_region:
        required: false
        type: string
        default: "eu-west-2"
        description: "AWS region"
    outputs:
      encrypted_secrets:
        description: "GPG-encrypted, base64-encoded JSON map of secret name to value. Decrypt with the decrypt-secret action"
        value: ${{ jobs.retrieve-secret.outputs.encrypted_secrets }}
    secrets:
      AWS_ACCOUNT_NUMBER:
        description: "AWS account number holding the secret and the read role"
        required: true
      AWS_ROLE_NAME:
        description: "Name of the IAM role to assume via OIDC"
        required: true
      PASSPHRASE:
        description: "Passphrase used for GPG encryption"
        required: true

permissions: {}

jobs:
  retrieve-secret:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      encrypted_secrets: ${{ steps.encrypt.outputs.encrypted_secrets }}
    steps:
      - name: Validate inputs
        env:
          SECRET_NAME: ${{ inputs.secret_name }}
          SECRET_ID: ${{ inputs.secret_id }}
          SSM_PARAMETER: ${{ inputs.secret_arn_ssm_parameter }}
        run: |
          if [[ ! "$SECRET_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::secret_name must be a valid environment variable name"
            exit 1
          fi
          if [ -z "$SECRET_ID" ] && [ -z "$SSM_PARAMETER" ]; then
            echo "::error::Set secret_id or secret_arn_ssm_parameter"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_NUMBER }}:role/${{ secrets.AWS_ROLE_NAME }}"
          role-session-name: githubactionsrolesession
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve secret ID
        id: resolve
        env:
          SECRET_ID: ${{ inputs.secret_id }}
          SSM_PARAMETER: ${{ inputs.secret_arn_ssm_parameter }}
        run: |
          set -euo pipefail
          if [ -z "$SECRET_ID" ]; then
            SECRET_ID=$(aws ssm get-parameter --name "$SSM_PARAMETER" --with-decryption --query Parameter.Value --output text)
          fi
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"

      - name: Retrieve secret from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            SECRET_VALUE,${{ steps.resolve.outputs.secret_id }}

      - name: Encrypt secret
        id: encrypt
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -euo pipefail
          encrypted=$(jq -n --arg k "$SECRET_NAME" --arg v "$SECRET_VALUE" '{($k): $v}' \
            | gpg --symmetric --batch --pinentry-mode loopback --passphrase-file <(printf '%s' "$PASSPHRASE") --output - \
            | base64 -w0)
          echo "encrypted_secrets=$encrypted" >> "$GITHUB_OUTPUT"
